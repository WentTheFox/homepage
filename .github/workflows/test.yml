name: Tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Run Vitest directly so `--shard` is parsed as an option
      # Node 25+ defines a global localStorage getter that returns undefined (without --localstorage-file) and shadows jsdom's, which fails every
      # test touching localStorage; turning the experimental Web Storage global off lets jsdom's work (Node 24, upstream's version, has no such global)
      - run: pnpm -s exec vitest run --shard ${{ matrix.shard }}/4 --pool forks
        env:
          NODE_OPTIONS: --no-experimental-webstorage
