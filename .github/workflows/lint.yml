name: Lint

on:
  pull_request:
  push:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Linting Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      # pre-commit/action (v3.0.1) calls an unpinned actions/cache, which a "pin every action to a full SHA" policy rejects, so run
      # pre-commit directly (the same three things the action does: cache, install, run)
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Check files
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # import/no-cycle is off in eslint.config.mjs (too slow for local runs); CI enforces it with the same options upstream uses.
      - name: Lint frontend
        run: |
          pnpm exec eslint . --rule '{"import/no-cycle": ["error", {"maxDepth": 1}]}'
